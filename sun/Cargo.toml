[package]
name = "sun"
description = "Servidor self-hosted do Orbit"
version.workspace = true
edition.workspace = true

[dependencies]
orbit-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
futures-util = "0.3.34"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.6.0"
thiserror.workspace = true
tower-http = { version = "0.7.1", features = ["cors"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
getrandom = "0.4.3"

[dev-dependencies]
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
