[workspace]
resolver = "3"
members = ["shared", "sun", "moon/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
orbit-shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# specta/tauri-specta ainda estão em RC: versões fixadas com `=` (ver docs/decisions/0005).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

# Profiles só valem na raiz do workspace.
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
